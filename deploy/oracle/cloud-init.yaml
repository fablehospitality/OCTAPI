#cloud-config
# Paste this whole file into "Show advanced options > Management >
# Initialization script > Paste cloud-init script" when creating the
# Oracle Cloud instance (Ubuntu image). It installs and starts the connector.
# Progress log on the server: /var/log/octapi-install.log
runcmd:
  - [bash, -c, "apt-get update -y && apt-get install -y git curl"]
  - [bash, -c, "git clone https://github.com/fablehospitality/octapi /opt/octapi"]
  - [bash, -c, "bash /opt/octapi/deploy/oracle/install.sh > /var/log/octapi-install.log 2>&1"]
